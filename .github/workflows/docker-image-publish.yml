name: Build and Publish Docker Image

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-prepare:
    name: Docker Prepare
    runs-on: ubuntu-24.04
    outputs:
      meta-images: ${{ steps.meta-images.outputs.value }}
      image-tag: ${{ steps.meta-images.outputs.image-tag }}
    steps:
      - name: Build image metadata inputs
        id: meta-images
        env:
          GHCR_REPOSITORY: ${{ github.repository }}
        run: |
          image_tag="sha-${GITHUB_SHA::7}"
          {
            echo "image-tag=$image_tag"
            echo 'value<<EOF'
            echo "ghcr.io/$GHCR_REPOSITORY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  docker-build:
    name: Docker Image Build
    needs: docker-prepare
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      runner: |
        default=ubuntu-24.04
        linux/arm=ubuntu-24.04-arm
        linux/arm64=ubuntu-24.04-arm
      distribute: true
      platforms: linux/amd64,linux/arm64
      output: ${{ github.event_name == 'push' && 'image' || 'local' }}
      push: ${{ github.event_name == 'push' }}
      context: .
      file: build/docker/main/Dockerfile
      artifact-upload: false
      sign: false
      cache: true
      cache-mode: max
      cache-scope: sealos-nm-agent-image
      sbom: false
      set-meta-annotations: true
      set-meta-labels: true
      meta-images: ${{ needs.docker-prepare.outputs.meta-images }}
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=ref,event=tag
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest,enable={{is_default_branch}}
        type=raw,value=${{ needs.docker-prepare.outputs.image-tag }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
